<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;background:#050b18;color:white;font-family:Arial,sans-serif;overflow:hidden}
#particles{position:fixed;inset:0;z-index:0;pointer-events:none}
.particle{position:absolute;bottom:-20px;background:#168cff;border-radius:50%;box-shadow:0 0 12px #168cff,0 0 25px #087bff;animation:rise linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:.9}85%{opacity:.6}100%{transform:translateY(-110vh);opacity:0}}
.app{position:relative;z-index:1;display:flex;height:100dvh}
.sidebar{width:230px;padding:22px;background:#091326dd;border-right:1px solid #173b65}
.logo{font-size:24px;font-weight:bold;color:#40aaff;margin-bottom:35px;text-shadow:0 0 15px #168cff}
.nav{width:100%;padding:14px;margin-bottom:10px;color:#d8eaff;background:#10213a;border:1px solid #183b60;border-radius:12px;text-align:left;cursor:pointer}
.nav:hover{background:#17416d}
.main{flex:1;display:flex;flex-direction:column;min-width:0}
header{height:70px;flex-shrink:0;padding:22px;border-bottom:1px solid #18395b;font-size:20px;font-weight:bold}
.content{flex:1;overflow:auto;padding:25px}
.welcome{text-align:center;margin:12vh auto 35px}
.welcome h1{font-size:38px;color:#55b7ff;text-shadow:0 0 25px #087bff}
.welcome p,.muted{color:#8daecc}
.chat{max-width:750px;margin:auto}
.message{background:#10233dcc;border:1px solid #205080;padding:14px;border-radius:15px;margin:12px 0;white-space:pre-wrap;overflow-wrap:anywhere}
.input-area{padding:16px;display:flex;gap:10px;border-top:1px solid #18395b;background:#081326dd}
input{min-width:0;padding:12px;border-radius:12px;border:1px solid #28629a;background:#0d1d33;color:white;outline:none}
#message{flex:1;padding:15px}
button{font:inherit}
.send,.primary{border:0;border-radius:12px;padding:12px 20px;background:#087bff;color:white;font-weight:bold;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#other{max-width:900px;margin:0 auto}
.photo-app{background:#0b1930;border:1px solid #1d4772;border-radius:16px;padding:20px}
.photo-toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:16px}
.photo-toolbar input[type=file]{max-width:100%}
.photo-layout{display:grid;grid-template-columns:minmax(0,1fr) 230px;gap:18px}
.canvas-wrap{min-height:320px;display:flex;align-items:center;justify-content:center;background:#050b18;border:1px dashed #28629a;border-radius:12px;overflow:hidden}
#photoCanvas{display:none;max-width:100%;max-height:58vh;object-fit:contain}
#emptyPhoto{padding:30px;text-align:center;color:#8daecc}
.controls{padding:14px;background:#10213a;border-radius:12px}
.control{margin:0 0 18px}
.control label{display:flex;justify-content:space-between;margin-bottom:8px;color:#d8eaff}
.control input{width:100%;padding:0;accent-color:#168cff}
#photoStatus{min-height:24px;margin-top:14px;white-space:pre-wrap;overflow-wrap:anywhere;color:#b8d9f5}
#photoStatus a{color:#62bdff}
#account{font-size:12px;color:#8daecc;margin-top:22px;overflow-wrap:anywhere}
@media(max-width:700px){.sidebar{width:75px;padding:10px}.logo{font-size:12px;word-break:break-all}.nav{font-size:11px;padding:10px 4px;text-align:center}.content{padding:12px}.welcome h1{font-size:29px}.photo-layout{grid-template-columns:1fr}.canvas-wrap{min-height:240px}}
</style>
</head>
<body>
<div id="particles"></div>
<div class="app">
  <aside class="sidebar">
    <div class="logo">🤖 ルイトAI</div>
    <button class="nav" onclick="showPage('chat')">💬 チャット</button>
    <button class="nav" onclick="showPage('friends')">👥 フレンド</button>
    <button class="nav" onclick="showPage('photos')">🖼 写真編集</button>
    <button class="nav" onclick="showPage('games')">🎮 ゲーム</button>
    <button class="nav" onclick="showPage('settings')">⚙ 設定</button>
    <div id="account">アカウント確認中…</div>
  </aside>
  <main class="main">
    <header id="pageTitle">💬 チャット</header>
    <section class="content">
      <div id="welcome" class="welcome"><h1>Welcome to RUITO AI</h1><p>未来のコミュニケーションを、ここから。</p></div>
      <div id="chat" class="chat"></div>
      <div id="other"></div>
    </section>
    <div class="input-area" id="inputArea"><input id="message" placeholder="メッセージを入力..."><button class="send" onclick="sendMessage()">送信</button></div>
  </main>
</div>
<script>
const particleArea=document.getElementById("particles");
for(let i=0;i<45;i++){const p=document.createElement("div");p.className="particle";const size=Math.random()*4+2;p.style.width=size+"px";p.style.height=size+"px";p.style.left=Math.random()*100+"%";p.style.animationDuration=(Math.random()*12+7)+"s";p.style.animationDelay=(-Math.random()*15)+"s";particleArea.appendChild(p)}

let selectedImage=null;
let photoUrl=null;
function sendMessage(){const input=document.getElementById("message");const value=input.value.trim();if(!value)return;const msg=document.createElement("div");msg.className="message";msg.textContent="あなた： "+value;document.getElementById("chat").appendChild(msg);input.value=""}
document.getElementById("message").addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage()});
function showPage(page){
  const names={chat:"💬 チャット",friends:"👥 フレンド",photos:"🖼 写真編集",games:"🎮 ゲーム",settings:"⚙ 設定"};
  document.getElementById("pageTitle").textContent=names[page];
  document.getElementById("welcome").style.display=page==="chat"?"block":"none";
  document.getElementById("chat").style.display=page==="chat"?"block":"none";
  document.getElementById("inputArea").style.display=page==="chat"?"flex":"none";
  const other=document.getElementById("other");
  if(page==="photos"){renderPhotoEditor();return}
  other.replaceChildren();
  if(page!=="chat"){const note=document.createElement("div");note.className="message";note.textContent="「"+names[page]+"」機能は開発準備中です。";other.appendChild(note)}
}
function renderPhotoEditor(){
  const other=document.getElementById("other");
  other.innerHTML=`<div class="photo-app">
    <h2>写真編集</h2><p class="muted">画像を選び、明るさ・コントラストを調整してGoogle Driveに保存できます。</p>
    <div class="photo-toolbar"><input id="photoFile" type="file" accept="image/*"><button class="primary" id="savePhoto">編集した画像をDriveに保存</button></div>
    <div class="photo-layout"><div class="canvas-wrap"><p id="emptyPhoto">ここに画像プレビューが表示されます</p><canvas id="photoCanvas"></canvas></div>
    <div class="controls"><div class="control"><label for="brightness">明るさ <span id="brightnessValue">100%</span></label><input id="brightness" type="range" min="30" max="170" value="100"></div>
    <div class="control"><label for="contrast">コントラスト <span id="contrastValue">100%</span></label><input id="contrast" type="range" min="30" max="170" value="100"></div>
    <button class="nav" type="button" onclick="resetPhotoFilters()">調整をリセット</button></div></div><div id="photoStatus"></div></div>`;
  document.getElementById("photoFile").addEventListener("change",loadPhoto);
  document.getElementById("brightness").addEventListener("input",drawPhoto);
  document.getElementById("contrast").addEventListener("input",drawPhoto);
  document.getElementById("savePhoto").addEventListener("click",savePhoto);
}
function loadPhoto(event){
  const file=event.target.files&&event.target.files[0];if(!file)return;
  if(!file.type.startsWith("image/")){setPhotoStatus("画像ファイルを選んでください。");return}
  if(file.size>4*1024*1024){setPhotoStatus("画像は4MB以下にしてください。");event.target.value="";return}
  const reader=new FileReader();reader.onload=()=>{const image=new Image();image.onload=()=>{selectedImage={image,name:file.name};document.getElementById("emptyPhoto").style.display="none";document.getElementById("photoCanvas").style.display="block";drawPhoto();setPhotoStatus("")};image.onerror=()=>setPhotoStatus("画像を読み込めませんでした。");image.src=reader.result};reader.readAsDataURL(file);
}
function drawPhoto(){
  if(!selectedImage)return;
  const canvas=document.getElementById("photoCanvas"),ctx=canvas.getContext("2d");
  canvas.width=selectedImage.image.naturalWidth;canvas.height=selectedImage.image.naturalHeight;
  const brightness=document.getElementById("brightness").value,contrast=document.getElementById("contrast").value;
  document.getElementById("brightnessValue").textContent=brightness+"%";document.getElementById("contrastValue").textContent=contrast+"%";
  ctx.filter=`brightness(${brightness}%) contrast(${contrast}%)`;ctx.drawImage(selectedImage.image,0,0);ctx.filter="none";
}
function resetPhotoFilters(){if(!selectedImage)return;document.getElementById("brightness").value=100;document.getElementById("contrast").value=100;drawPhoto()}
function savePhoto(){
  if(!selectedImage){setPhotoStatus("先に画像を追加してください。");return}
  const button=document.getElementById("savePhoto");button.disabled=true;setPhotoStatus("保存中…");
  const dataUrl=document.getElementById("photoCanvas").toDataURL("image/jpeg",0.9);
  google.script.run.withSuccessHandler(result=>{button.disabled=false;const status=document.getElementById("photoStatus");status.textContent="Driveに保存しました：";const link=document.createElement("a");link.href=result.url;link.target="_blank";link.rel="noopener";link.textContent=result.name;status.appendChild(link)}).withFailureHandler(error=>{button.disabled=false;setPhotoStatus("保存に失敗しました: "+(error.message||error))}).saveEditedImage({name:selectedImage.name,dataUrl});
}
function setPhotoStatus(message){const status=document.getElementById("photoStatus");if(status)status.textContent=message}
google.script.run.withSuccessHandler(email=>{document.getElementById("account").textContent="Googleアカウント: "+email}).withFailureHandler(()=>{document.getElementById("account").textContent="Googleアカウントで利用"}).getCurrentUser();
</script>
</body>
</html>
