<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#050b18;
  color:white;
  font-family:Arial,sans-serif;
  overflow:hidden;
}
#particles{
  position:fixed;
  inset:0;
  z-index:0;
  pointer-events:none;
}
.particle{
  position:absolute;
  bottom:-20px;
  background:#168cff;
  border-radius:50%;
  box-shadow:0 0 12px #168cff,0 0 25px #087bff;
  animation:rise linear infinite;
}
@keyframes rise{
  0%{transform:translateY(0);opacity:0}
  15%{opacity:.9}
  85%{opacity:.6}
  100%{transform:translateY(-110vh);opacity:0}
}
.app{
  position:relative;
  z-index:1;
  display:flex;
  height:100dvh;
}
.sidebar{
  width:230px;
  padding:22px;
  background:#091326dd;
  border-right:1px solid #173b65;
}
.logo{
  font-size:24px;
  font-weight:bold;
  color:#40aaff;
  margin-bottom:35px;
  text-shadow:0 0 15px #168cff;
}
.nav{
  width:100%;
  padding:14px;
  margin-bottom:10px;
  color:#d8eaff;
  background:#10213a;
  border:1px solid #183b60;
  border-radius:12px;
  text-align:left;
  cursor:pointer;
}
.nav:hover{background:#17416d}
.main{
  flex:1;
  display:flex;
  flex-direction:column;
  min-width:0;
}
header{
  height:70px;
  padding:22px;
  border-bottom:1px solid #18395b;
  font-size:20px;
  font-weight:bold;
}
.content{
  flex:1;
  overflow:auto;
  padding:25px;
}
.welcome{
  text-align:center;
  margin:12vh auto 35px;
}
.welcome h1{
  font-size:38px;
  color:#55b7ff;
  text-shadow:0 0 25px #087bff;
}
.welcome p{color:#8daecc}
.chat{
  max-width:750px;
  margin:auto;
}
.message{
  background:#10233dcc;
  border:1px solid #205080;
  padding:14px;
  border-radius:15px;
  margin:12px 0;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.input-area{
  padding:16px;
  display:flex;
  gap:10px;
  border-top:1px solid #18395b;
  background:#081326dd;
}
input{
  flex:1;
  min-width:0;
  padding:15px;
  border-radius:12px;
  border:1px solid #28629a;
  background:#0d1d33;
  color:white;
  outline:none;
}
.send{
  border:0;
  border-radius:12px;
  padding:0 22px;
  background:#087bff;
  color:white;
  font-weight:bold;
  cursor:pointer;
}
@media(max-width:650px){
  .sidebar{width:75px;padding:10px}
  .logo{font-size:12px;word-break:break-all}
  .nav{font-size:11px;padding:10px 4px;text-align:center}
  .content{padding:12px}
  .welcome h1{font-size:29px}
}
</style>
</head>
<body>

<div id="particles"></div>

<div class="app">
  <aside class="sidebar">
    <div class="logo">🤖 ルイトAI</div>
    <button class="nav" onclick="showPage('chat')">💬 チャット</button>
    <button class="nav" onclick="showPage('friends')">👥 フレンド</button>
    <button class="nav" onclick="showPage('photos')">🖼 写真</button>
    <button class="nav" onclick="showPage('games')">🎮 ゲーム</button>
    <button class="nav" onclick="showPage('settings')">⚙ 設定</button>
  </aside>

  <main class="main">
    <header id="pageTitle">💬 チャット</header>

    <section class="content">
      <div id="welcome" class="welcome">
        <h1>Welcome to RUITO AI</h1>
        <p>未来のコミュニケーションを、ここから。</p>
      </div>
      <div id="chat" class="chat"></div>
      <div id="other"></div>
    </section>

    <div class="input-area" id="inputArea">
      <input id="message" placeholder="メッセージを入力..." />
      <button class="send" onclick="sendMessage()">送信</button>
    </div>
  </main>
</div>

<script>
const particleArea=document.getElementById("particles");

for(let i=0;i<45;i++){
  const p=document.createElement("div");
  p.className="particle";
  const size=Math.random()*4+2;
  p.style.width=size+"px";
  p.style.height=size+"px";
  p.style.left=Math.random()*100+"%";
  p.style.animationDuration=(Math.random()*12+7)+"s";
  p.style.animationDelay=(-Math.random()*15)+"s";
  particleArea.appendChild(p);
}

function sendMessage(){
  const input=document.getElementById("message");
  const value=input.value.trim();
  if(!value)return;

  const msg=document.createElement("div");
  msg.className="message";
  msg.textContent="あなた： "+value;
  document.getElementById("chat").appendChild(msg);
  input.value="";
}

document.getElementById("message").addEventListener("keydown",e=>{
  if(e.key==="Enter")sendMessage();
});

function showPage(page){
  const names={
    chat:"💬 チャット",
    friends:"👥 フレンド",
    photos:"🖼 写真",
    games:"🎮 ゲーム",
    settings:"⚙ 設定"
  };
  document.getElementById("pageTitle").textContent=names[page];
  document.getElementById("welcome").style.display=page==="chat"?"block":"none";
  document.getElementById("chat").style.display=page==="chat"?"block":"none";
  document.getElementById("inputArea").style.display=page==="chat"?"flex":"none";
  document.getElementById("other").textContent=
    page==="chat"?"":"「"+names[page]+"」機能は開���準備中です。";
}
</script>
</body>
</html>
