<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#07101e">
<title>ルイトCRAFT 3D</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#87ceeb;color:#fff;font-family:system-ui,sans-serif;touch-action:none}#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}#top{position:absolute;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start} .panel{background:#07101dcc;border:1px solid #8ccfff66;border-radius:12px;padding:9px 12px;backdrop-filter:blur(8px)}button{pointer-events:auto;border:1px solid #8ccfff88;border-radius:9px;background:#102a46e8;color:#fff;padding:9px 12px;font-weight:700}#crosshair{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:24px;font-weight:300}#hint{position:absolute;left:50%;top:calc(50% + 25px);transform:translateX(-50%);font-size:11px;white-space:nowrap;color:#fff}#hotbar{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:5px;pointer-events:auto}.slot{width:48px;height:48px;display:grid;place-items:center;background:#07101dcc;border:2px solid #ffffff66;border-radius:8px;font-size:11px}.slot.selected{border:3px solid #fff;background:#1666aacc}#mobile{display:none;position:absolute;inset:auto 0 75px 0;height:145px;pointer-events:none}.stick{position:absolute;left:18px;bottom:0;width:118px;height:118px;border-radius:50%;background:#07101e66;border:2px solid #ffffff77;pointer-events:auto;touch-action:none}.knob{position:absolute;left:34px;top:34px;width:46px;height:46px;border-radius:50%;background:#b9e4ff99;border:2px solid white}.actions{position:absolute;right:16px;bottom:4px;display:grid;grid-template-columns:repeat(2,58px);gap:8px;pointer-events:auto}.actions button{height:52px;padding:4px;font-size:11px}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#02081799;z-index:5}#menu .card{width:min(420px,calc(100% - 30px));padding:22px;background:#0b1a2eee;border:1px solid #69bfff88;border-radius:18px;box-shadow:0 20px 80px #0009}#menu h1{margin:0 0 5px;color:#83d1ff}#menu p{color:#c5d9eb;font-size:13px;line-height:1.6}#menu button{width:100%;margin-top:8px;padding:12px}#status{font-size:12px;color:#b9d9f4;margin-top:8px}@media(max-width:700px),(pointer:coarse){#mobile{display:block}#hint{display:none}.slot{width:39px;height:42px}#top{font-size:12px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
 <div id="top"><div class="panel"><b>⛏️ ルイトCRAFT</b><div id="stats">ワールド生成中…</div></div><div class="panel"><button id="modeBtn">モード：サバイバル</button> <button id="menuBtn">メニュー</button></div></div>
 <div id="crosshair">＋</div><div id="hint">クリックで視点固定 / WASD移動 / Ctrlダッシュ / Spaceジャンプ・飛行 / 左クリック破壊 / 右クリック設置 / 1〜5で選択</div>
 <div id="hotbar"></div>
 <div id="mobile"><div class="stick" id="stick"><div class="knob" id="knob"></div></div><div class="actions"><button id="mineBtn">⛏ 破壊</button><button id="placeBtn">🧱 設置</button><button id="jumpBtn">⬆ ジャンプ</button><button id="switchBtn">▣ 選択</button></div></div>
</div>
<div id="menu"><div class="card"><h1>🌍 ルイトCRAFT</h1><p>ランダム生成されたブロック世界を探検しよう！<br>一人称視点・サバイバル／クリエイティブ対応。<br>※開発初期版：敵・クラフト・オンライン機能はまだありません。</p><button id="startBtn">ワールドに入る</button><button id="newWorldBtn">新しいランダムワールド</button><div id="status">読み込み中…</div></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const root=document.getElementById('game'),status=document.getElementById('status');
if(!window.THREE){status.textContent='3Dライブラリを読み込めません。ネット接続を確認してください。';return;}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.Fog(0x87ceeb,18,52);
const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,.1,100);camera.rotation.order='YXZ';
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputEncoding=THREE.sRGBEncoding;root.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd8efff,0x66734a,1.15));const sun=new THREE.DirectionalLight(0xfff0d2,1.25);sun.position.set(-12,24,8);scene.add(sun);
const materials={grass:new THREE.MeshLambertMaterial({color:0x58a83e}),dirt:new THREE.MeshLambertMaterial({color:0x8b5a35}),stone:new THREE.MeshLambertMaterial({color:0x858b91}),sand:new THREE.MeshLambertMaterial({color:0xd8c27a}),wood:new THREE.MeshLambertMaterial({color:0x986332}),leaves:new THREE.MeshLambertMaterial({color:0x287b38})};
const geo=new THREE.BoxGeometry(1,1,1),blocks=new Map(),worldGroup=new THREE.Group();scene.add(worldGroup);let mode='survival',selected='grass',seed=0,worldRadius=13,velocityY=0,onGround=false,yaw=0,pitch=0,locked=false,lookPointer=null;const keys={};let moveX=0,moveZ=0;
const blockNames=['grass','dirt','stone','sand','wood'];const colors={grass:'🟩',dirt:'🟫',stone:'⬜',sand:'🟨',wood:'🪵'};
function key(x,y,z){return x+','+y+','+z}
function addBlock(x,y,z,type){const k=key(x,y,z);if(blocks.has(k))return;const mesh=new THREE.Mesh(geo,materials[type]||materials.grass);mesh.position.set(x,y,z);mesh.userData={x,y,z,type};worldGroup.add(mesh);blocks.set(k,mesh)}
function removeBlock(mesh){const d=mesh.userData;worldGroup.remove(mesh);blocks.delete(key(d.x,d.y,d.z))}
function noise(x,z){const n=Math.sin((x+seed)*12.9898+(z-seed)*78.233)*43758.5453;return n-Math.floor(n)}
function heightAt(x,z){return Math.floor(2+Math.sin((x+seed)*.28)*1.4+Math.cos((z-seed)*.23)*1.3+noise(x,z)*1.8)}
function generateWorld(){worldGroup.clear();blocks.clear();seed=Math.floor(Math.random()*100000);for(let x=-worldRadius;x<=worldRadius;x++){for(let z=-worldRadius;z<=worldRadius;z++){const h=heightAt(x,z);for(let y=0;y<=h;y++){let type=y===h?'grass':y>h-3?'dirt':'stone';if(h<=2&&y===h)type='sand';addBlock(x,y,z,type)}if(noise(x+77,z-41)>.986&&Math.abs(x)+Math.abs(z)>5&&h>2){for(let y=1;y<=3;y++)addBlock(x,h+y,z,'wood');for(let dx=-2;dx<=2;dx++)for(let dz=-2;dz<=2;dz++)for(let dy=2;dy<=4;dy++)if(Math.abs(dx)+Math.abs(dz)+(dy===4?1:0)<5)addBlock(x+dx,h+dy,z+dz,'leaves')}}}camera.position.set(0,heightAt(0,0)+4,0);velocityY=0;document.getElementById('stats').textContent='ランダムワールド / ブロック '+blocks.size+'個';status.textContent='ワールド生成完了！';}
const raycaster=new THREE.Raycaster();raycaster.far=6;function targetBlock(){raycaster.setFromCamera(new THREE.Vector2(0,0),camera);const hits=raycaster.intersectObjects(worldGroup.children,false);return hits[0]||null}
function mine(){const hit=targetBlock();if(!hit)return;if(mode==='survival'&&hit.object.userData.y===0)return;removeBlock(hit.object)}
function place(){const hit=targetBlock();if(!hit)return;const normal=hit.face.normal.clone().transformDirection(hit.object.matrixWorld);const p=hit.object.position.clone().add(normal);const x=Math.round(p.x),y=Math.round(p.y),z=Math.round(p.z);if(y<0||y>20||blocks.has(key(x,y,z)))return;if(Math.abs(x-camera.position.x)<.8&&Math.abs(z-camera.position.z)<.8&&Math.abs(y-camera.position.y)<1.8)return;addBlock(x,y,z,selected)}
function updateHotbar(){const bar=document.getElementById('hotbar');bar.innerHTML='';blockNames.forEach(type=>{const b=document.createElement('button');b.className='slot'+(type===selected?' selected':'');b.textContent=colors[type];b.title=type;b.onclick=()=>{selected=type;updateHotbar()};bar.appendChild(b)})}
function setMode(){mode=mode==='survival'?'creative':'survival';document.getElementById('modeBtn').textContent='モード：'+(mode==='survival'?'サバイバル':'クリエイティブ');}
document.getElementById('modeBtn').onclick=setMode;document.getElementById('switchBtn').onclick=()=>{let i=blockNames.indexOf(selected);selected=blockNames[(i+1)%blockNames.length];updateHotbar()};document.getElementById('mineBtn').onclick=mine;document.getElementById('placeBtn').onclick=place;document.getElementById('jumpBtn').onclick=()=>{if(onGround){velocityY=7;onGround=false}};
document.getElementById('menuBtn').onclick=()=>{document.getElementById('menu').style.display='grid';if(document.pointerLockElement)document.exitPointerLock()};
document.getElementById('startBtn').onclick=()=>{document.getElementById('menu').style.display='none';if(matchMedia('(pointer:fine)').matches)renderer.domElement.requestPointerLock?.()};
document.getElementById('newWorldBtn').onclick=()=>{generateWorld();document.getElementById('menu').style.display='none'};
renderer.domElement.addEventListener('click',()=>{if(matchMedia('(pointer:fine)').matches&&!locked&&document.getElementById('menu').style.display==='none')renderer.domElement.requestPointerLock?.()});
document.addEventListener('pointerlockchange',()=>locked=document.pointerLockElement===renderer.domElement);
document.addEventListener('mousemove',e=>{if(!locked)return;yaw-=e.movementX*.002;pitch-=e.movementY*.002;pitch=Math.max(-1.45,Math.min(1.45,pitch));camera.rotation.set(pitch,yaw,0)});
renderer.domElement.addEventListener('contextmenu',e=>e.preventDefault());renderer.domElement.addEventListener('mousedown',e=>{if(!locked)return;if(e.button===0)mine();if(e.button===2)place()});
document.addEventListener('keydown',e=>{keys[e.code]=true;if(['Space','ArrowUp','ArrowDown'].includes(e.code))e.preventDefault();if(e.code==='Space'&&onGround){velocityY=7;onGround=false}if(e.code.startsWith('Digit')){const i=Number(e.code.slice(5))-1;if(blockNames[i]){selected=blockNames[i];updateHotbar()}}});
document.addEventListener('keyup',e=>keys[e.code]=false);
let touchLook=null;renderer.domElement.addEventListener('touchstart',e=>{if(e.touches.length&&e.touches[0].clientX>innerWidth*.35)touchLook={x:e.touches[0].clientX,y:e.touches[0].clientY,id:e.touches[0].identifier}},{passive:true});
renderer.domElement.addEventListener('touchmove',e=>{if(!touchLook)return;const t=[...e.touches].find(v=>v.identifier===touchLook.id);if(!t)return;const dx=t.clientX-touchLook.x,dy=t.clientY-touchLook.y;yaw-=dx*.004;pitch=Math.max(-1.45,Math.min(1.45,pitch-dy*.004));camera.rotation.set(pitch,yaw,0);touchLook.x=t.clientX;touchLook.y=t.clientY},{passive:true});
renderer.domElement.addEventListener('touchend',e=>{if(touchLook&&![...e.touches].some(t=>t.identifier===touchLook.id))touchLook=null},{passive:true});
const stick=document.getElementById('stick'),knob=document.getElementById('knob');let stickId=null;stick.addEventListener('pointerdown',e=>{stickId=e.pointerId;stick.setPointerCapture(stickId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===stickId)moveStick(e)});function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,len=Math.hypot(dx,dy),m=Math.min(38,len),a=Math.atan2(dy,dx);knob.style.transform='translate('+(Math.cos(a)*m)+'px,'+(Math.sin(a)*m)+'px)';moveX=Math.cos(a)*m/38;moveZ=Math.sin(a)*m/38}function resetStick(){stickId=null;moveX=moveZ=0;knob.style.transform=''}stick.addEventListener('pointerup',resetStick);stick.addEventListener('pointercancel',resetStick);
let last=performance.now();function animate(now){requestAnimationFrame(animate);const dt=Math.min(.04,(now-last)/1000);last=now;const forward=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)-moveZ;const side=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+moveX;const len=Math.hypot(forward,side)||1;const sprint=(keys.ControlLeft||keys.ControlRight)?1.7:1;const speed=(mode==='creative'?7:4.5)*sprint;const dx=(side*Math.cos(yaw)-forward*Math.sin(yaw))/len*speed*dt;const dz=(-side*Math.sin(yaw)-forward*Math.cos(yaw))/len*speed*dt;camera.position.x+=dx;camera.position.z+=dz;camera.position.x=Math.max(-worldRadius+.5,Math.min(worldRadius-.5,camera.position.x));camera.position.z=Math.max(-worldRadius+.5,Math.min(worldRadius-.5,camera.position.z));const ground=heightAt(Math.round(camera.position.x),Math.round(camera.position.z))+2.1;if(mode==='creative'){camera.position.y=Math.max(ground,camera.position.y+((keys.Space?1:0)-(keys.ShiftLeft||keys.ShiftRight?1:0))*7*dt);}else{velocityY-=18*dt;camera.position.y+=velocityY*dt;if(camera.position.y<=ground){camera.position.y=ground;velocityY=0;onGround=true}else onGround=false;}renderer.render(scene,camera)}
window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5))});
generateWorld();updateHotbar();requestAnimationFrame(animate);
})();
</script>
</body>
</html>
